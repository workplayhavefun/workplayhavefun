[Interface]
#the client PrivateKey is auto-generated by the wireguard app on your phone/iPad/Computer
PrivateKey = PASTE_YOUR_CLIENT_PRIVATE_KEY_HERE
#change the below IP Address to match the one in the relevant device in the PEER table at the WireGuard HOST
Address = 198.18.7.5/32
DNS = 192.168.1.91

[Peer]
#the PublicKey is generated by the common WireGuard HOST on the server (same for all devices)
PublicKey = PASTE_YOUR_HOST_PUBLIC_KEY_HERE
AllowedIPs = 192.168.1.0/24, 198.18.7.0/24
#add your DDNS NAME or Public IP Address below e.g.  or 94.128.232.42:51820 or yourname.ddns.net:51820
Endpoint = yourname.ddns.net:51820
PersistentKeepalive = 25
